name: CI REBOLSYS

on:
  push:
    branches: [main, develop-gamarra]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebolsysBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Ejecutar pruebas backend y empaquetar
        run: bash ./mvnw -B package

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebolsysFrontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: rebolsysFrontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas Vitest
        run: npm test -- --watch=false
      - name: Compilar producción
        run: npm run build
