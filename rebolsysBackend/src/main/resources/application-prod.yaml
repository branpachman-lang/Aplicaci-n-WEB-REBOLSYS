server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.driver.OracleDriver
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

springdoc:
  swagger-ui:
    enabled: false
    csrf:
      enabled: false
  api-docs:
    enabled: false

logging:
  file:
    name: ${LOG_FILE:logs/rebolsys-backend.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{requestId:-sin-id}] %-5level %logger{36} - %msg%n"
  level:
    root: WARN
    pe.com.rebolsysBackend: INFO
