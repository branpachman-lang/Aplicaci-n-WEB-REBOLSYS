spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 500ms
      timeout: 500ms
      ssl:
        enabled: ${REDIS_SSL:false}
      repositories:
        enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    deserialization:
      accept-float-as-int: false
  application:
    name: rebolsysBackend
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:true}
      mail.smtp.ssl.enable: ${MAIL_SSL:false}
      mail.smtp.connectiontimeout: 8000
      mail.smtp.timeout: 8000
      mail.smtp.writetimeout: 8000
  profiles:
    active: dev
  flyway:
    # El DDL se administra manualmente salvo habilitación explícita por entorno.
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      roles: GERENTE
      probes:
        enabled: true
  health:
    mail:
      enabled: false
    redis:
      enabled: ${CACHE_ENABLED:true}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%X{requestId:-sin-id}] %-5level %logger{36} - %msg%n"

app:
  cache:
    habilitada: ${CACHE_ENABLED:true}
    prefijo: ${CACHE_PREFIX:rebolsys:dev:v1:}
    ttl-catalogos: 10m
    ttl-referencias: 30m
  reservas:
    tolerancia-ingreso: ${RESERVAS_TOLERANCIA_INGRESO:2h}
    checkout-automatico:
      habilitado: ${CHECKOUT_AUTOMATICO_HABILITADO:false}
      intervalo: ${CHECKOUT_AUTOMATICO_INTERVALO:60000}
      espera-inicial: ${CHECKOUT_AUTOMATICO_ESPERA_INICIAL:10000}
  correo:
    habilitado: ${MAIL_ENABLED:false}
    remitente: ${MAIL_FROM:${MAIL_USERNAME:}}
  jwt:
    secret: ${JWT_SECRET:}
    duracion-maxima: ${JWT_DURACION_MAXIMA:8h}
    inactividad-predeterminada: 30m
    validar-instancia: ${JWT_VALIDAR_INSTANCIA:true}
    revocar-en-redis: ${JWT_REVOCAR_EN_REDIS:false}
  seguridad:
    rate-limit-login:
      habilitado: ${LOGIN_RATE_LIMIT_ENABLED:true}
      max-intentos-ip: ${LOGIN_RATE_LIMIT_MAX_POR_MINUTO:30}
      ventana: ${LOGIN_RATE_LIMIT_VENTANA:1m}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

apis-peru:
  url: ${APISPERU_BASE_URL:https://dniruc.apisperu.com/api/v1}
  token: ${APISPERU_TOKEN:}
  timeout-millis: ${APISPERU_TIMEOUT_MILLIS:8000}

facturacion:
  apisperu:
    habilitada: ${FACTURACION_HABILITADA:false}
    url: ${FACTURACION_APISPERU_URL:https://facturacion.apisperu.com/api/v1}
    token: ${FACTURACION_APISPERU_TOKEN:}
    usuario: ${FACTURACION_APISPERU_USUARIO:}
    password: ${FACTURACION_APISPERU_PASSWORD:}
    id-empresa: ${FACTURACION_APISPERU_ID_EMPRESA:}
    ruc: ${FACTURACION_EMISOR_RUC:}
    razon-social: ${FACTURACION_EMISOR_RAZON_SOCIAL:}
    direccion: ${FACTURACION_EMISOR_DIRECCION:}
    ubigeo: ${FACTURACION_EMISOR_UBIGEO:}
    departamento: ${FACTURACION_EMISOR_DEPARTAMENTO:}
    provincia: ${FACTURACION_EMISOR_PROVINCIA:}
    distrito: ${FACTURACION_EMISOR_DISTRITO:}
    timeout-millis: ${FACTURACION_TIMEOUT_MILLIS:8000}
