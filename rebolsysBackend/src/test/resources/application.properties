# Evitar tareas de fondo durante las pruebas; los escenarios las invocan explícitamente.
app.reservas.checkout-automatico.habilitado=false
# Las pruebas comunes no requieren Redis ni SMTP. Su integración tiene pruebas optativas.
app.cache.habilitada=false
management.health.redis.enabled=false
management.health.mail.enabled=false
