@if (visible()) {
  <aside class="session-banner no-print" role="status" aria-live="polite">
    <span>
      Tu sesión vencerá en {{ segundosRestantes() }} s por inactividad.
    </span>
    <div class="session-banner-actions">
      <button
        type="button"
        class="button small primary"
        [disabled]="renovando()"
        (click)="continuar()"
      >
        {{ renovando() ? 'Renovando…' : 'Continuar sesión' }}
      </button>
      <button type="button" class="button small" (click)="ocultar()">
        Ocultar
      </button>
    </div>
  </aside>
}
