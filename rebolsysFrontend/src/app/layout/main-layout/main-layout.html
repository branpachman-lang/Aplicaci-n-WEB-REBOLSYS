<div class="app-shell" [class.menu-open]="!menuColapsado()" (keydown.escape)="cerrarMenu($event)">
  <app-sidebar (navegar)="cerrarMenu()" />
  @if (!menuColapsado()) {
    <button
      class="menu-backdrop"
      aria-label="Cerrar menú"
      (click)="cerrarMenu()"
    ></button>
  }
  <div class="workspace">
    <app-header [menuAbierto]="!menuColapsado()" (toggleMenu)="alternarMenu()" />
    <app-aviso-sesion />
    <main><router-outlet /></main>
  </div>
</div>
